<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2980B9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#F8F9FA"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="1200" height="60" fill="url(#headerGradient)"/>
  <text x="600" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    FIX-FastTrade Message Processing Sequence
  </text>
  
  <!-- Actors -->
  <g id="actors">
    <!-- Client -->
    <rect x="50" y="80" width="120" height="60" fill="#3498DB" rx="5" filter="url(#shadow)"/>
    <text x="110" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      FIX Client
    </text>
    <text x="110" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      (Exchange)
    </text>
    
    <!-- FIX Service -->
    <rect x="250" y="80" width="120" height="60" fill="#27AE60" rx="5" filter="url(#shadow)"/>
    <text x="310" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      FixService
    </text>
    <text x="310" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Session Mgmt
    </text>
    
    <!-- Message Parser -->
    <rect x="450" y="80" width="120" height="60" fill="#F39C12" rx="5" filter="url(#shadow)"/>
    <text x="510" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      MessageParser
    </text>
    <text x="510" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Zero-Copy
    </text>
    
    <!-- Trading Service -->
    <rect x="650" y="80" width="120" height="60" fill="#E74C3C" rx="5" filter="url(#shadow)"/>
    <text x="710" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      TradingService
    </text>
    <text x="710" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Order Mgmt
    </text>
    
    <!-- Order Model -->
    <rect x="850" y="80" width="120" height="60" fill="#9B59B6" rx="5" filter="url(#shadow)"/>
    <text x="910" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Order Model
    </text>
    <text x="910" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Lifecycle
    </text>
    
    <!-- Performance Monitor -->
    <rect x="1050" y="80" width="120" height="60" fill="#1ABC9C" rx="5" filter="url(#shadow)"/>
    <text x="1110" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Performance
    </text>
    <text x="1110" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      Monitor
    </text>
  </g>
  
  <!-- Lifelines -->
  <g id="lifelines" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5,5">
    <line x1="110" y1="140" x2="110" y2="850"/>
    <line x1="310" y1="140" x2="310" y2="850"/>
    <line x1="510" y1="140" x2="510" y2="850"/>
    <line x1="710" y1="140" x2="710" y2="850"/>
    <line x1="910" y1="140" x2="910" y2="850"/>
    <line x1="1110" y1="140" x2="1110" y2="850"/>
  </g>
  
  <!-- Messages -->
  <g id="messages">
    <!-- 1. New Order Single -->
    <line x1="110" y1="180" x2="310" y2="180" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="150" y="165" width="120" height="30" fill="#ECF0F1" rx="3"/>
    <text x="210" y="175" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      1. NewOrderSingle
    </text>
    <text x="210" y="188" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="9">
      FIX 4.4 Message
    </text>
    
    <!-- 2. Parse Message -->
    <line x1="310" y1="220" x2="510" y2="220" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="350" y="205" width="120" height="30" fill="#FEF9E7" rx="3"/>
    <text x="410" y="215" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      2. parseMessage()
    </text>
    <text x="410" y="228" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="9">
      Zero-Copy Parse
    </text>
    
    <!-- 3. Parsed Message Return -->
    <line x1="510" y1="260" x2="310" y2="260" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <rect x="350" y="245" width="120" height="30" fill="#FEF9E7" rx="3"/>
    <text x="410" y="255" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      3. ZeroCopyMessage
    </text>
    <text x="410" y="268" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="9">
      &lt; 100ns parse time
    </text>
    
    <!-- 4. Process Order -->
    <line x1="310" y1="300" x2="710" y2="300" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="450" y="285" width="120" height="30" fill="#E8F6F3" rx="3"/>
    <text x="510" y="295" text-anchor="middle" fill="#27AE60" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      4. processOrder()
    </text>
    <text x="510" y="308" text-anchor="middle" fill="#27AE60" font-family="Arial, sans-serif" font-size="9">
      Business Logic
    </text>
    
    <!-- 5. Create Order -->
    <line x1="710" y1="340" x2="910" y2="340" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="750" y="325" width="120" height="30" fill="#F4ECF7" rx="3"/>
    <text x="810" y="335" text-anchor="middle" fill="#8E44AD" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      5. createOrder()
    </text>
    <text x="810" y="348" text-anchor="middle" fill="#8E44AD" font-family="Arial, sans-serif" font-size="9">
      Order Lifecycle
    </text>
    
    <!-- 6. Validate Order -->
    <rect x="910" y="370" width="80" height="40" fill="#F4ECF7" rx="3"/>
    <text x="950" y="385" text-anchor="middle" fill="#8E44AD" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      6. validate()
    </text>
    <text x="950" y="398" text-anchor="middle" fill="#8E44AD" font-family="Arial, sans-serif" font-size="9">
      Risk Checks
    </text>
    
    <!-- 7. Order Created -->
    <line x1="910" y1="430" x2="710" y2="430" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <rect x="750" y="415" width="120" height="30" fill="#F4ECF7" rx="3"/>
    <text x="810" y="425" text-anchor="middle" fill="#8E44AD" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      7. Order Created
    </text>
    <text x="810" y="438" text-anchor="middle" fill="#8E44AD" font-family="Arial, sans-serif" font-size="9">
      Status: NEW
    </text>
    
    <!-- 8. Log Performance -->
    <line x1="710" y1="470" x2="1110" y2="470" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="850" y="455" width="120" height="30" fill="#E8F8F5" rx="3"/>
    <text x="910" y="465" text-anchor="middle" fill="#16A085" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      8. logMetrics()
    </text>
    <text x="910" y="478" text-anchor="middle" fill="#16A085" font-family="Arial, sans-serif" font-size="9">
      Latency: 0.8μs
    </text>
    
    <!-- 9. Execute Trade -->
    <rect x="710" y="500" width="80" height="40" fill="#E8F6F3" rx="3"/>
    <text x="750" y="515" text-anchor="middle" fill="#27AE60" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      9. execute()
    </text>
    <text x="750" y="528" text-anchor="middle" fill="#27AE60" font-family="Arial, sans-serif" font-size="9">
      Trade Logic
    </text>
    
    <!-- 10. Generate Execution Report -->
    <line x1="710" y1="560" x2="310" y2="560" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="450" y="545" width="120" height="30" fill="#E8F6F3" rx="3"/>
    <text x="510" y="555" text-anchor="middle" fill="#27AE60" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      10. ExecutionReport
    </text>
    <text x="510" y="568" text-anchor="middle" fill="#27AE60" font-family="Arial, sans-serif" font-size="9">
      Trade Confirmation
    </text>
    
    <!-- 11. Format FIX Message -->
    <line x1="310" y1="600" x2="510" y2="600" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="350" y="585" width="120" height="30" fill="#FEF9E7" rx="3"/>
    <text x="410" y="595" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      11. formatMessage()
    </text>
    <text x="410" y="608" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="9">
      FIX 4.4 Format
    </text>
    
    <!-- 12. Formatted Message -->
    <line x1="510" y1="640" x2="310" y2="640" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <rect x="350" y="625" width="120" height="30" fill="#FEF9E7" rx="3"/>
    <text x="410" y="635" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      12. FIX Message
    </text>
    <text x="410" y="648" text-anchor="middle" fill="#8B4513" font-family="Arial, sans-serif" font-size="9">
      Zero-Copy Buffer
    </text>
    
    <!-- 13. Send Response -->
    <line x1="310" y1="680" x2="110" y2="680" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="150" y="665" width="120" height="30" fill="#ECF0F1" rx="3"/>
    <text x="210" y="675" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      13. ExecutionReport
    </text>
    <text x="210" y="688" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="9">
      Order Filled
    </text>
    
    <!-- 14. Performance Stats -->
    <line x1="1110" y1="720" x2="310" y2="720" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <rect x="650" y="705" width="120" height="30" fill="#E8F8F5" rx="3"/>
    <text x="710" y="715" text-anchor="middle" fill="#16A085" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      14. Stats Update
    </text>
    <text x="710" y="728" text-anchor="middle" fill="#16A085" font-family="Arial, sans-serif" font-size="9">
      Total: 0.95μs
    </text>
  </g>
  
  <!-- Performance Annotations -->
  <g id="performance-annotations">
    <rect x="50" y="760" width="1100" height="80" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="600" y="785" text-anchor="middle" fill="#1ABC9C" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Performance Characteristics
    </text>
    
    <rect x="80" y="800" width="180" height="30" fill="#1ABC9C" rx="3"/>
    <text x="170" y="818" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
      Parse: &lt; 100ns
    </text>
    
    <rect x="280" y="800" width="180" height="30" fill="#1ABC9C" rx="3"/>
    <text x="370" y="818" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
      Process: &lt; 500ns
    </text>
    
    <rect x="480" y="800" width="180" height="30" fill="#1ABC9C" rx="3"/>
    <text x="570" y="818" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
      Execute: &lt; 300ns
    </text>
    
    <rect x="680" y="800" width="180" height="30" fill="#1ABC9C" rx="3"/>
    <text x="770" y="818" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
      Format: &lt; 150ns
    </text>
    
    <rect x="880" y="800" width="180" height="30" fill="#1ABC9C" rx="3"/>
    <text x="970" y="818" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
      Total: &lt; 1μs
    </text>
  </g>
  
  <!-- Timeline -->
  <g id="timeline">
    <text x="30" y="180" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">t0</text>
    <text x="30" y="300" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">t+100ns</text>
    <text x="30" y="430" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">t+600ns</text>
    <text x="30" y="560" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">t+900ns</text>
    <text x="30" y="680" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">t+950ns</text>
  </g>
</svg>