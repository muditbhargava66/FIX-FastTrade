<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
    
    <!-- Performance gradient -->
    <linearGradient id="performanceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Circuit pattern -->
    <pattern id="circuitPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
      <path d="M20,20 L80,20 L80,80 L20,80 Z" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" fill="none"/>
      <circle cx="20" cy="20" r="2" fill="#ffffff" fill-opacity="0.1"/>
      <circle cx="80" cy="20" r="2" fill="#ffffff" fill-opacity="0.1"/>
      <circle cx="80" cy="80" r="2" fill="#ffffff" fill-opacity="0.1"/>
      <circle cx="20" cy="80" r="2" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#mainGradient)"/>
  
  <!-- Circuit pattern overlay -->
  <rect width="1280" height="640" fill="url(#circuitPattern)" opacity="0.3"/>
  
  <!-- Geometric shapes for modern look -->
  <g opacity="0.1">
    <polygon points="0,0 200,0 150,100 0,100" fill="#ffffff"/>
    <polygon points="1280,640 1080,640 1130,540 1280,540" fill="#ffffff"/>
    <circle cx="1100" cy="150" r="80" fill="#ffffff"/>
    <circle cx="180" cy="490" r="60" fill="#ffffff"/>
  </g>
  
  <!-- Main content container -->
  <g id="main-content">
    <!-- Logo/Icon area -->
    <g id="logo-section">
      <!-- Modern FIX icon -->
      <rect x="80" y="180" width="120" height="120" fill="url(#accentGradient)" rx="15" filter="url(#shadow)"/>
      <text x="140" y="230" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">
        FIX
      </text>
      <text x="140" y="260" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="normal">
        4.2/4.4
      </text>
      
      <!-- Speed indicator -->
      <g id="speed-lines">
        <line x1="220" y1="220" x2="280" y2="220" stroke="#27ae60" stroke-width="4" opacity="0.8"/>
        <line x1="230" y1="240" x2="290" y2="240" stroke="#27ae60" stroke-width="4" opacity="0.6"/>
        <line x1="240" y1="260" x2="300" y2="260" stroke="#27ae60" stroke-width="4" opacity="0.4"/>
      </g>
    </g>
    
    <!-- Main title -->
    <g id="title-section">
      <text x="350" y="200" fill="white" font-family="Arial, sans-serif" font-size="72" font-weight="bold" filter="url(#glow)">
        FIX-FastTrade
      </text>
      <text x="350" y="240" fill="#ecf0f1" font-family="Arial, sans-serif" font-size="28" font-weight="300">
        High-Performance Electronic Trading System
      </text>
      
      <!-- Version badge -->
      <rect x="350" y="260" width="140" height="35" fill="url(#performanceGradient)" rx="17" filter="url(#shadow)"/>
      <text x="420" y="282" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
        v2.0.0
      </text>
    </g>
    
    <!-- Key features -->
    <g id="features-section">
      <!-- Performance metrics -->
      <g id="performance-metrics">
        <rect x="350" y="320" width="180" height="60" fill="rgba(255,255,255,0.1)" rx="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <text x="360" y="340" fill="#f1c40f" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
          ULTRA-LOW LATENCY
        </text>
        <text x="360" y="365" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
          &lt; 1μs
        </text>
        
        <rect x="550" y="320" width="180" height="60" fill="rgba(255,255,255,0.1)" rx="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <text x="560" y="340" fill="#2ecc71" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
          HIGH THROUGHPUT
        </text>
        <text x="560" y="365" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
          1M+ msg/s
        </text>
        
        <rect x="750" y="320" width="180" height="60" fill="rgba(255,255,255,0.1)" rx="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <text x="760" y="340" fill="#e74c3c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
          CPU EFFICIENCY
        </text>
        <text x="760" y="365" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
          90%+
        </text>
      </g>
      
      <!-- Platform support -->
      <g id="platform-support">
        <text x="350" y="420" fill="#bdc3c7" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
          CROSS-PLATFORM SUPPORT
        </text>
        
        <!-- Platform icons -->
        <rect x="350" y="440" width="80" height="30" fill="rgba(255,255,255,0.15)" rx="5"/>
        <text x="390" y="458" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
          macOS
        </text>
        
        <rect x="440" y="440" width="80" height="30" fill="rgba(255,255,255,0.15)" rx="5"/>
        <text x="480" y="458" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
          Linux
        </text>
        
        <rect x="530" y="440" width="80" height="30" fill="rgba(255,255,255,0.15)" rx="5"/>
        <text x="570" y="458" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
          Windows
        </text>
        
        <!-- Architecture support -->
        <rect x="630" y="440" width="80" height="30" fill="rgba(39,174,96,0.3)" rx="5"/>
        <text x="670" y="458" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
          ARM64
        </text>
        
        <rect x="720" y="440" width="80" height="30" fill="rgba(39,174,96,0.3)" rx="5"/>
        <text x="760" y="458" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
          x86_64
        </text>
        
        <!-- SIMD support -->
        <rect x="810" y="440" width="80" height="30" fill="rgba(243,156,18,0.3)" rx="5"/>
        <text x="850" y="458" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
          SIMD
        </text>
      </g>
    </g>
    
    <!-- Technology stack -->
    <g id="tech-stack">
      <text x="350" y="510" fill="#bdc3c7" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
        TECHNOLOGY STACK
      </text>
      
      <rect x="350" y="525" width="100" height="25" fill="rgba(255,255,255,0.1)" rx="3"/>
      <text x="400" y="540" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
        C++17
      </text>
      
      <rect x="460" y="525" width="100" height="25" fill="rgba(255,255,255,0.1)" rx="3"/>
      <text x="510" y="540" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
        Zero-Copy
      </text>
      
      <rect x="570" y="525" width="100" height="25" fill="rgba(255,255,255,0.1)" rx="3"/>
      <text x="620" y="540" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
        Lock-Free
      </text>
      
      <rect x="680" y="525" width="100" height="25" fill="rgba(255,255,255,0.1)" rx="3"/>
      <text x="730" y="540" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
        Memory Pools
      </text>
      
      <rect x="790" y="525" width="100" height="25" fill="rgba(255,255,255,0.1)" rx="3"/>
      <text x="840" y="540" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
        CPU Affinity
      </text>
    </g>
  </g>
  
  <!-- Right side visualization -->
  <g id="right-visualization">
    <!-- Performance graph visualization -->
    <g id="performance-graph">
      <rect x="1000" y="200" width="220" height="150" fill="rgba(255,255,255,0.05)" rx="10" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="1110" y="220" text-anchor="middle" fill="#bdc3c7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
        LATENCY DISTRIBUTION
      </text>
      
      <!-- Simulated latency bars -->
      <rect x="1020" y="320" width="15" height="20" fill="#27ae60"/>
      <rect x="1040" y="310" width="15" height="30" fill="#27ae60"/>
      <rect x="1060" y="300" width="15" height="40" fill="#2ecc71"/>
      <rect x="1080" y="290" width="15" height="50" fill="#2ecc71"/>
      <rect x="1100" y="280" width="15" height="60" fill="#f1c40f"/>
      <rect x="1120" y="290" width="15" height="50" fill="#2ecc71"/>
      <rect x="1140" y="300" width="15" height="40" fill="#2ecc71"/>
      <rect x="1160" y="310" width="15" height="30" fill="#27ae60"/>
      <rect x="1180" y="320" width="15" height="20" fill="#27ae60"/>
      
      <text x="1110" y="365" text-anchor="middle" fill="#bdc3c7" font-family="Arial, sans-serif" font-size="10">
        &lt; 1μs: 95% | &lt; 2μs: 99.9%
      </text>
    </g>
    
    <!-- Status indicators -->
    <g id="status-indicators">
      <rect x="1000" y="380" width="220" height="100" fill="rgba(255,255,255,0.05)" rx="10" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="1110" y="400" text-anchor="middle" fill="#bdc3c7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
        SYSTEM STATUS
      </text>
      
      <!-- Status lights -->
      <circle cx="1030" cy="420" r="6" fill="#27ae60"/>
      <text x="1045" y="425" fill="white" font-family="Arial, sans-serif" font-size="11">
        FIX Engine: ACTIVE
      </text>
      
      <circle cx="1030" cy="440" r="6" fill="#27ae60"/>
      <text x="1045" y="445" fill="white" font-family="Arial, sans-serif" font-size="11">
        Trading: READY
      </text>
      
      <circle cx="1030" cy="460" r="6" fill="#f1c40f"/>
      <text x="1045" y="465" fill="white" font-family="Arial, sans-serif" font-size="11">
        Performance: OPTIMAL
      </text>
    </g>
    
    <!-- Production ready badge -->
    <g id="production-badge">
      <rect x="1000" y="500" width="220" height="60" fill="url(#accentGradient)" rx="10" filter="url(#shadow)"/>
      <text x="1110" y="525" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
        ✅ PRODUCTION READY
      </text>
      <text x="1110" y="545" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
        Enterprise Grade • Battle Tested
      </text>
    </g>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1280" height="20" fill="url(#accentGradient)" opacity="0.8"/>
  
  <!-- Subtle animation elements -->
  <g id="animation-elements" opacity="0.3">
    <circle cx="200" cy="100" r="3" fill="#27ae60">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="100" r="3" fill="#f1c40f">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="50" r="2" fill="#3498db">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>