# FIX-FastTrade Configuration File
# High-Performance FIX Session Settings

[DEFAULT]
# Connection settings
ConnectionType=initiator
SocketConnectHost=localhost
SocketConnectPort=5001
HeartBtInt=30
ReconnectInterval=5
FileLogPath=logs
FileStorePath=data

# Performance optimizations
SocketNoDelay=Y
SocketSendBufferSize=8388608
SocketReceiveBufferSize=8388608
CheckLatency=Y
MillisecondsInTimeStamp=Y
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValues=N
ValidateUserDefinedFields=N
AllowUnknownMsgFields=Y
PreserveMessageFieldsOrder=N

# Zero-copy optimizations
UseDataRaw=Y
SendRedundantResendRequests=N
RefreshOnLogon=N

[SESSION]
BeginString=FIX.4.4
SenderCompID=FIXFASTTRADE
TargetCompID=EXCHANGE
SessionQualifier=PROD
StartTime=00:00:00
EndTime=23:59:59
# Use local time for performance (no TZ conversion)
UseLocalTime=Y
# Disable persistence for ultra-low latency
PersistMessages=N
# Aggressive sequence number handling
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=N
# Message validation optimizations
ValidateLengthAndChecksum=N
ValidateCompID=Y
